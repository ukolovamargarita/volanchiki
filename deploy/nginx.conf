# /etc/nginx/sites-available/volanchiki  (замените DOMAIN на ваш тестовый домен)
server {
    listen 80;
    server_name DOMAIN;

    # Собранный фронтенд (frontend/dist -> /var/www/volanchiki)
    root /var/www/volanchiki;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Бэкенд .NET на localhost:5080. Агент отвечает до 90 сек -> большие таймауты
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
